name: Update ticket evidence

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

concurrency:
  group: update-ticket-evidence
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check out the app
        uses: actions/checkout@v4
        with:
          repository: chobbledotcom/tickets
          ref: main
          path: app
          token: ${{ secrets.TICKETS_EVIDENCE_TOKEN }}
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: app/.tool-versions

      - name: Resolve Playwright version
        id: playwright
        working-directory: app
        run: |
          version="$(deno eval '
            const config = JSON.parse(await Deno.readTextFile("deno.json"));
            const version = config.imports.playwright.match(/^npm:playwright@(.+)$/)?.[1];
            if (!version) throw new Error("playwright must be pinned in deno.json");
            console.log(version);
          ')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium and system dependencies
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: deno run -A npm:playwright@${{ steps.playwright.outputs.version }} install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        working-directory: app
        run: deno run -A npm:playwright@${{ steps.playwright.outputs.version }} install-deps chromium

      # The screenshots are taken here rather than downloaded, because how they
      # look is this repository's business: evidence-themes/ dresses each one.
      - name: Capture evidence in this site's themes
        id: evidence
        working-directory: app
        run: |
          deno task specs:evidence --themes "$GITHUB_WORKSPACE/evidence-themes"
          echo "directory=$GITHUB_WORKSPACE/app/reports/evidence" >> "$GITHUB_OUTPUT"

      # Kept whatever happens next. An import refused for narrative drift needs
      # the evidence it refused, and the runner's copy goes with the runner.
      - name: Keep the captured evidence
        uses: actions/upload-artifact@v4
        with:
          name: captured-ticket-evidence
          path: ${{ steps.evidence.outputs.directory }}
          if-no-files-found: error
          retention-days: 30

      - name: Import evidence
        id: import
        run: bun run evidence:import --from "${{ steps.evidence.outputs.directory }}"

      - name: Explain a refused import
        if: failure() && steps.import.outcome == 'failure'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## The import was refused

          If the message above says a story changed, the site's words about that
          screenshot were written against an older version of it and someone has
          to read the new one.

          1. Download the `captured-ticket-evidence` artifact from this run.
          2. `bun run evidence:review <capture> --from <that-directory>`
          3. Update the words in `_data/ticket_evidence_map.json` if they no
             longer match the story.
          4. `bun run evidence:review <capture> --from <that-directory> --accept`
          5. `bun run evidence:import --from <that-directory>` and commit.
          SUMMARY

      - name: Test
        run: bun run test

      - name: Run precommit checks
        run: bun run precommit

      - name: Create or update the review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-ticket-evidence
          delete-branch: true
          commit-message: Update ticket screenshot evidence
          title: Update ticket screenshot evidence
          body: |
            This pull request imports the latest tested screenshot evidence from the Tickets app.

            Run `bun run evidence:review` to read each capture's story beside the
            words the site writes about it. If the import failed because a story
            changed, update the words in `_data/ticket_evidence_map.json`, then
            record the new story with
            `bun run evidence:review <capture> --from <artifact-dir> --accept`.
            Accept from the artifact you are importing: without `--from` the
            digest is read from the committed data and the import still fails.
          add-paths: |
            _data/ticket_evidence.json
            _data/ticket_evidence_lock.json
            images/screenshots/activity-log-summer-arts-fair.png
            images/screenshots/activity-log-summer-arts-fair__facebook.png
            images/screenshots/api-keys-list.png
            images/screenshots/api-keys-list__facebook.png
            images/screenshots/deposits-and-balance-payments.png
            images/screenshots/deposits-and-balance-payments__facebook.png
            images/screenshots/garden-party-package-checkout.png
            images/screenshots/garden-party-package-checkout__facebook.png
            images/screenshots/manual-attendee-community-supper.png
            images/screenshots/manual-attendee-community-supper__facebook.png
            images/screenshots/multi-day-hire.png
            images/screenshots/multi-day-hire__facebook.png
            images/screenshots/oakfield-homepage-editor.png
            images/screenshots/oakfield-homepage-editor__facebook.png
            images/screenshots/oakfield-public-website.png
            images/screenshots/oakfield-public-website__facebook.png
            images/screenshots/payment-provider-choice.png
            images/screenshots/payment-provider-choice__facebook.png
            images/screenshots/place-lost-while-paying.png
            images/screenshots/place-lost-while-paying__facebook.png
            images/screenshots/promo-codes-and-add-ons-checkout.png
            images/screenshots/promo-codes-and-add-ons-checkout__facebook.png
            images/screenshots/qr-code-check-in.png
            images/screenshots/qr-code-check-in__facebook.png
            images/screenshots/record-put-right.png
            images/screenshots/record-put-right__facebook.png
            images/screenshots/record-repaired.png
            images/screenshots/record-repaired__facebook.png
            images/screenshots/refunded-booking.png
            images/screenshots/refunded-booking__facebook.png
            images/screenshots/riverside-events-team.png
            images/screenshots/riverside-events-team__facebook.png
            images/screenshots/servicing-studio-floor-hold.png
            images/screenshots/servicing-studio-floor-hold__facebook.png
            images/screenshots/summer-appeal-purchase.png
            images/screenshots/summer-appeal-purchase__facebook.png
            images/screenshots/summer-arts-fair-ledger.png
            images/screenshots/summer-arts-fair-ledger__facebook.png
            images/screenshots/summer-fair-volunteer-form.png
            images/screenshots/summer-fair-volunteer-form__facebook.png
            images/screenshots/the-tempest-group-checkout.png
            images/screenshots/the-tempest-group-checkout__facebook.png

name: Update ticket evidence

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

concurrency:
  group: update-ticket-evidence
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v5
        with:
          # @chobble/js-toolkit is a file: dependency inside the pinned
          # template, so installing needs the submodule to be here.
          submodules: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check out the app
        uses: actions/checkout@v5
        with:
          repository: chobbledotcom/tickets
          ref: main
          path: app
          # The app is a public repository, so the default workflow token can
          # read it. If it ever goes private, set the TICKETS_EVIDENCE_TOKEN
          # secret to a token with read access to that repository.
          token: ${{ secrets.TICKETS_EVIDENCE_TOKEN || github.token }}
          persist-credentials: false

      # The app pins its Deno version as denoVersion in devenv.nix, so the
      # workflow reads it from there rather than naming one here.
      - name: Resolve the Deno version the app pins
        id: deno-version
        working-directory: app
        run: |
          version="$(sed -n 's/^[[:space:]]*denoVersion = "\([^"]*\)".*/\1/p' devenv.nix | tail -n 1)"
          if [ -z "$version" ]; then
            echo "No denoVersion found in devenv.nix" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ steps.deno-version.outputs.version }}

      - name: Resolve Playwright version
        id: playwright
        working-directory: app
        run: |
          version="$(deno eval '
            const config = JSON.parse(await Deno.readTextFile("deno.json"));
            const version = config.imports.playwright.match(/^npm:playwright@(.+)$/)?.[1];
            if (!version) throw new Error("playwright must be pinned in deno.json");
            console.log(version);
          ')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        id: chromium-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Both installs fetch packages from Ubuntu's archive servers, which
      # sometimes stop resolving for a few minutes on a hosted runner. Playwright
      # gives up before that ends, so the install is attempted again.
      - name: Install Chromium and system dependencies
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: |
          for attempt in 1 2 3; do
            if deno run -A npm:playwright@${{ steps.playwright.outputs.version }} install --with-deps chromium; then
              exit 0
            fi
            echo "Chromium install failed (attempt $attempt of 3)." >&2
            if [ "$attempt" -lt 3 ]; then
              sleep 60
            fi
          done
          exit 1

      - name: Install Chromium system dependencies
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        working-directory: app
        run: |
          for attempt in 1 2 3; do
            if deno run -A npm:playwright@${{ steps.playwright.outputs.version }} install-deps chromium; then
              exit 0
            fi
            echo "Chromium system dependency install failed (attempt $attempt of 3)." >&2
            if [ "$attempt" -lt 3 ]; then
              sleep 60
            fi
          done
          exit 1

      # The screenshots are taken here rather than downloaded, because how they
      # look is this repository's business: evidence-themes/ dresses each one.
      - name: Capture evidence in this site's themes
        id: evidence
        working-directory: app
        run: |
          deno task specs:evidence --themes "$GITHUB_WORKSPACE/evidence-themes"
          echo "directory=$GITHUB_WORKSPACE/app/reports/evidence" >> "$GITHUB_OUTPUT"

      # Kept whatever happens next. An import refused for narrative drift needs
      # the evidence it refused, and the runner's copy goes with the runner.
      - name: Keep the captured evidence
        uses: actions/upload-artifact@v6
        with:
          name: captured-ticket-evidence
          path: ${{ steps.evidence.outputs.directory }}
          if-no-files-found: error
          retention-days: 30

      - name: Import evidence
        id: import
        run: bun run evidence:import --from "${{ steps.evidence.outputs.directory }}"

      - name: Explain a refused import
        if: failure() && steps.import.outcome == 'failure'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## The import was refused

          If the message above says a story changed, the site's words about that
          screenshot were written against an older version of it and someone has
          to read the new one.

          1. Download the `captured-ticket-evidence` artifact from this run.
          2. `bun run evidence:review <capture> --from <that-directory>`
          3. Update the words in `_data/ticket_evidence_map.json` if they no
             longer match the story.
          4. `bun run evidence:review <capture> --from <that-directory> --accept`
          5. `bun run evidence:import --from <that-directory>` and commit.
          SUMMARY

      - name: Test
        run: bun run test

      - name: Run precommit checks
        run: bun run precommit

      # The push that updates the review branch can be refused by GitHub for
      # reasons on its side, and create-pull-request leaves the branch untouched
      # when that happens, so publishing again is safe.
      - name: Create or update the review pull request
        id: publish
        continue-on-error: true
        uses: ./.github/actions/publish-evidence-pr

      - name: Wait before publishing again
        if: steps.publish.outcome == 'failure'
        run: sleep 30

      - name: Create or update the review pull request again
        if: steps.publish.outcome == 'failure'
        uses: ./.github/actions/publish-evidence-pr

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [update]
    if: failure()
    steps:
      - name: Send failure notification
        uses: NiNiyas/ntfy-action@master
        with:
          url: 'https://ntfy.sh'
          topic: ${{ secrets.NTFY_TOPIC }}

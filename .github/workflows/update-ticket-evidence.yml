name: Update ticket evidence

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

concurrency:
  group: update-ticket-evidence
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download the latest app evidence
        id: evidence
        env:
          GH_TOKEN: ${{ secrets.TICKETS_EVIDENCE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Add TICKETS_EVIDENCE_TOKEN with Actions read access to chobbledotcom/tickets." >&2
            exit 1
          fi
          run_id=$(gh api "repos/chobbledotcom/tickets/actions/workflows/spec-evidence.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [ -z "$run_id" ]; then
            echo "No successful evidence workflow run was found." >&2
            exit 1
          fi
          download="$RUNNER_TEMP/ticket-evidence"
          mkdir -p "$download"
          gh run download "$run_id" --repo chobbledotcom/tickets --dir "$download"
          mapfile -t manifests < <(find "$download" -type f -name manifest.json)
          if [ "${#manifests[@]}" -ne 1 ]; then
            echo "Expected one evidence manifest, found ${#manifests[@]}." >&2
            exit 1
          fi
          echo "directory=$(dirname "${manifests[0]}")" >> "$GITHUB_OUTPUT"

      # Kept whatever happens next. An import refused for narrative drift needs
      # the artifact it refused, and the runner's copy goes with the runner.
      - name: Keep the downloaded evidence
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-ticket-evidence
          path: ${{ steps.evidence.outputs.directory }}
          if-no-files-found: error
          retention-days: 30

      - name: Import evidence
        id: import
        run: bun run evidence:import --from "${{ steps.evidence.outputs.directory }}"

      - name: Explain a refused import
        if: failure() && steps.import.outcome == 'failure'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## The import was refused

          If the message above says a story changed, the site's words about that
          screenshot were written against an older version of it and someone has
          to read the new one.

          1. Download the `downloaded-ticket-evidence` artifact from this run.
          2. `bun run evidence:review <capture> --from <that-directory>`
          3. Update the words in `_data/ticket_evidence_map.json` if they no
             longer match the story.
          4. `bun run evidence:review <capture> --from <that-directory> --accept`
          5. `bun run evidence:import --from <that-directory>` and commit.
          SUMMARY

      - name: Test
        run: bun run test

      - name: Run precommit checks
        run: bun run precommit

      - name: Create or update the review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-ticket-evidence
          delete-branch: true
          commit-message: Update ticket screenshot evidence
          title: Update ticket screenshot evidence
          body: |
            This pull request imports the latest tested screenshot evidence from the Tickets app.

            Run `bun run evidence:review` to read each capture's story beside the
            words the site writes about it. If the import failed because a story
            changed, update the words in `_data/ticket_evidence_map.json`, then
            record the new story with
            `bun run evidence:review <capture> --from <artifact-dir> --accept`.
            Accept from the artifact you are importing: without `--from` the
            digest is read from the committed data and the import still fails.
          add-paths: |
            _data/ticket_evidence.json
            _data/ticket_evidence_lock.json
            images/screenshots/deposits-and-balance-payments.png
            images/screenshots/deposits-and-balance-payments__facebook.png
            images/screenshots/payment-provider-choice.png
            images/screenshots/payment-provider-choice__facebook.png
            images/screenshots/qr-code-check-in.png
            images/screenshots/qr-code-check-in__facebook.png
            images/screenshots/servicing-studio-floor-hold.png
            images/screenshots/servicing-studio-floor-hold__facebook.png
            pages/features/deposits-and-balance-payments.md
            pages/features/qr-code-check-ins.md
            pages/features/servicing-events.md
            pages/features/stripe-and-square.md

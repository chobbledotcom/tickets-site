name: Publish the evidence pull request
description: >-
  Commits the imported ticket evidence and opens or updates the review pull
  request that carries it. It lives in an action rather than in the workflow so
  that a transient failure can be attempted again with the same settings.

runs:
  using: composite
  steps:
    - name: Create or update the review pull request
      uses: peter-evans/create-pull-request@v8
      with:
        branch: automation/update-ticket-evidence
        delete-branch: true
        commit-message: Update ticket screenshot evidence
        title: Update ticket screenshot evidence
        body: |
          This pull request imports the latest tested screenshot evidence from the Tickets app.

          Run `bun run evidence:review` to read each capture's story beside the
          words the site writes about it. If the import failed because a story
          changed, update the words in `_data/ticket_evidence_map.json`, then
          record the new story with
          `bun run evidence:review <capture> --from <artifact-dir> --accept`.
          Accept from the artifact you are importing: without `--from` the
          digest is read from the committed data and the import still fails.
        add-paths: |
          _data/ticket_evidence.json
          _data/ticket_evidence_lock.json
          images/screenshots/activity-log-summer-arts-fair.png
          images/screenshots/activity-log-summer-arts-fair__facebook.png
          images/screenshots/api-keys-list.png
          images/screenshots/api-keys-list__facebook.png
          images/screenshots/attendee-csv-export.png
          images/screenshots/attendee-csv-export__facebook.png
          images/screenshots/backup-restore.png
          images/screenshots/backup-restore__facebook.png
